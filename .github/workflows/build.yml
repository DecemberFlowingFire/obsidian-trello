name: Build Plugin

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'main.js'
      - 'styles.css'
      - 'manifest.json'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
        
      - name: Commit build artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add main.js styles.css 2>/dev/null || git add main.js
          git diff --quiet && git diff --staged --quiet || git commit -m "build: auto-compile plugin"
          git push
